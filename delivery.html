<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaPure — Delivery Panel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f8fd; color: #1a1a2e; }
    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0c447c, #1a6fc4); padding: 24px; }
    .login-card { background: #fff; border-radius: 16px; padding: 32px; width: 100%; max-width: 360px; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #d0dce8; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
    input:focus { outline: none; border-color: #1a6fc4; }
    label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
    .btn { background: #1a6fc4; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
    .topbar { background: #1a6fc4; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    .topbar h1 { color: #fff; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .main { padding: 20px; max-width: 600px; margin: 0 auto; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .stat { background: #fff; border-radius: 10px; padding: 16px; text-align: center; border: 1px solid #e8eef5; }
    .stat .num { font-size: 24px; font-weight: 700; color: #1a6fc4; }
    .stat .lbl { font-size: 11px; color: #555; margin-top: 2px; }
    .order-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #e8eef5; }
    .order-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .order-plan { font-size: 15px; font-weight: 600; }
    .order-addr { font-size: 13px; color: #555; margin: 4px 0; }
    .order-time { font-size: 12px; color: #888; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-pending { background: #fff8e1; color: #ba7517; }
    .badge-transit { background: #e6f1fb; color: #0c447c; }
    .badge-delivered { background: #eaf3de; color: #3b6d11; }
    .action-btns { display: flex; gap: 8px; margin-top: 12px; }
    .action-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-transit { background: #e6f1fb; color: #0c447c; }
    .btn-delivered { background: #eaf3de; color: #3b6d11; }
    .btn-call { background: #f4f8fd; color: #555; border: 1px solid #e8eef5; }
    .empty { text-align: center; padding: 48px 24px; color: #555; }
    .empty i { font-size: 48px; color: #1a6fc4; margin-bottom: 12px; display: block; }
    .logout-btn { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    .alert-error { background: #fde8e8; color: #c0392b; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:20px;">
      <i class="ti ti-truck" style="font-size:40px;color:#1a6fc4;"></i>
      <h2 style="margin-top:8px;font-size:20px;font-weight:700;">Delivery Panel</h2>
      <p style="font-size:13px;color:#555;">AquaPure Delivery Team</p>
    </div>
    <div id="loginAlert"></div>
    <label>Email</label>
    <input type="email" id="delEmail" placeholder="delivery@aquapure.in">
    <label>Password</label>
    <input type="password" id="delPassword" placeholder="Your password">
    <button class="btn" onclick="deliveryLogin()"><i class="ti ti-login"></i> Login</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">
  <div class="topbar">
    <h1><i class="ti ti-truck"></i> My Deliveries</h1>
    <button class="logout-btn" onclick="deliveryLogout()">Logout</button>
  </div>
  <div class="main">
    <div class="stats">
      <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">Total</div></div>
      <div class="stat"><div class="num" id="pendingCount">0</div><div class="lbl">Pending</div></div>
      <div class="stat"><div class="num" id="doneCount">0</div><div class="lbl">Delivered</div></div>
    </div>
    <div class="section-title"><i class="ti ti-list"></i> Today's Orders</div>
    <div id="ordersList">
      <div class="empty"><i class="ti ti-loader"></i><p>Loading orders...</p></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBwf_05vXuD7ZyYk9Inb5tCGFg9beiItIk",
    authDomain: "aquapure-b9aa1.firebaseapp.com",
    projectId: "aquapure-b9aa1",
    storageBucket: "aquapure-b9aa1.firebasestorage.app",
    messagingSenderId: "669878567043",
    appId: "1:669878567043:web:00410b3d4c4d7f4a661bb6"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const ALLOWED_EMAILS = ["delivery@aquapure.in", "admin@aquapure.in"];

  onAuthStateChanged(auth, user => {
    if (user && ALLOWED_EMAILS.includes(user.email)) {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadOrders();
    } else if (user) {
      signOut(auth);
    }
  });

  window.deliveryLogin = async function() {
    const email = document.getElementById('delEmail').value;
    const password = document.getElementById('delPassword').value;
    if (!ALLOWED_EMAILS.includes(email)) {
      showAlert('Access denied!'); return;
    }
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch(e) {
      showAlert('Invalid credentials!');
    }
  };

  window.deliveryLogout = async function() {
    await signOut(auth);
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
  };

  function showAlert(msg) {
    const el = document.getElementById('loginAlert');
    el.className = 'alert alert-error';
    el.textContent = msg;
  }

  async function loadOrders() {
    const snap = await getDocs(collection(db, 'orders'));
    let total = 0, pending = 0, done = 0;
    let pendingHtml = '', doneHtml = '';

    snap.forEach(d => {
      const o = d.data();
      total++;
      if (o.status === 'delivered') {
        done++;
        doneHtml += renderCard(d.id, o, true);
      } else {
        pending++;
        pendingHtml += renderCard(d.id, o, false);
      }
    });

    document.getElementById('totalCount').textContent = total;
    document.getElementById('pendingCount').textContent = pending;
    document.getElementById('doneCount').textContent = done;

    if (total === 0) {
      document.getElementById('ordersList').innerHTML = '<div class="empty"><i class="ti ti-check-circle"></i><p>No orders today!</p></div>';
      return;
    }

    let html = '';
    if (pendingHtml) html += `<div style="margin-bottom:16px;"><div class="section-title" style="color:#ba7517;"><i class="ti ti-clock"></i> Pending (${pending})</div>${pendingHtml}</div>`;
    if (doneHtml) html += `<div><div class="section-title" style="color:#3b6d11;"><i class="ti ti-check"></i> Delivered (${done})</div>${doneHtml}</div>`;
    document.getElementById('ordersList').innerHTML = html;
  }

  function renderCard(id, o, isDone) {
    const badgeClass = isDone ? 'badge-delivered' : o.status === 'transit' ? 'badge-transit' : 'badge-pending';
    const statusText = isDone ? '✅ Delivered' : o.status === 'transit' ? '🚛 In Transit' : '⏳ Pending';
    return `<div class="order-card">
      <div class="order-top">
        <div>
          <div class="order-plan">${o.plan || 'N/A'}</div>
          <div class="order-addr"><i class="ti ti-map-pin" style="font-size:12px;"></i> ${o.address || 'No address'}</div>
          <div class="order-time"><i class="ti ti-clock" style="font-size:12px;"></i> ${o.time || 'Any time'}</div>
          ${o.notes ? `<div class="order-time"><i class="ti ti-note" style="font-size:12px;"></i> ${o.notes}</div>` : ''}
        </div>
        <span class="badge ${badgeClass}">${statusText}</span>
      </div>
      ${!isDone ? `<div class="action-btns">
        <button class="action-btn btn-transit" onclick="window.markStatus('${id}','transit')"><i class="ti ti-truck"></i> In Transit</button>
        <button class="action-btn btn-delivered" onclick="window.markStatus('${id}','delivered')"><i class="ti ti-check"></i> Delivered</button>
      </div>` : ''}
    </div>`;
  }

  window.markStatus = async function(orderId, status) {
    try {
      await updateDoc(doc(db, 'orders', orderId), { status });
      await loadOrders();
    } catch(e) { alert('Error! Try again.'); }
  };
</script>
</body>
</html>
